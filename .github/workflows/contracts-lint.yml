name: Contracts — Lint

on:
  push:
    branches: ["main"]
    paths:
      - "contracts/**"
  pull_request:
    branches: ["main"]
    paths:
      - "contracts/**"

jobs:
  fmt:
    name: forge fmt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check
