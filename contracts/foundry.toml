[profile.default]
src        = "src"
out        = "out"
libs       = ["lib"]
via_ir     = true
optimizer  = true
optimizer_runs = 200
solc       = "0.8.24"

# Fail loudly on compiler warnings we care about
# (forge lint --check enforced in CI)
[profile.default.fmt]
line_length    = 100
tab_width      = 4
bracket_spacing = true
int_types      = "long"

[profile.ci]
# Stricter build in CI — treat lints as errors
fuzz = { runs = 256 }

[rpc_endpoints]
celo        = "${CELO_RPC}"
celo_alfajores = "https://alfajores-forno.celo-testnet.org"

[etherscan]
celo = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=42220" }
